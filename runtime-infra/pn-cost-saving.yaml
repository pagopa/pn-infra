AWSTemplateFormatVersion: 2010-09-09
Description: Template for reducing costs on PN with ec2 and ecs

Parameters:  
  StopEc2FunctionTagName:
    Type: String
    Default: 'tostop'
    Description: Name of EC2 Tag that will be stopped

  StopEc2FunctionTagValue:
    Type: String
    Default: 'true'
    Description: Value of EC2 Tag that will be stopped

  StopEc2FunctionTagNameCronExpression:
    Type: String
    Default: 'cron(0 20 * * ? *)'
    Description: Cron expression when ec2 stop

  StopEc2FunctionScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: State of the EC2 stop scheduled rule

  Ec2MonthlyReportCronExpression:
    Type: String
    Default: 'cron(0 10 1 * ? *)'
    Description: Monthly EC2 report schedule, evaluated in the Europe/Rome timezone

  Ec2MonthlyReportScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: State of the monthly EC2 report schedule

  Ec2ReportRequiredTagName:
    Type: String
    Default: 'ToStop'
    Description: Tag required by the monthly report on non-micro EC2 instances

  Ec2ReportRequiredTagValue:
    Type: String
    Default: 'true'
    Description: Required tag value for non-micro EC2 instances

  WarningSNSTopicName:
    Type: String
    Default: 'pn-WarningSnsTopic'
    Description: Name of the central warning topic in the core account

  StopEcsCostSavingFunctionCronExpression:
    Type: String
    Default: 'cron(0 20 ? * MON-FRI *)'
    Description: Cron expression when ecs stop

  StartEcsCostSavingFunctionCronExpression:
    Type: String
    Default: 'cron(0 6 ? * MON-FRI *)'
    Description: Cron expression when ecs start

  ECSClusterName:
    Type: String
    Default: ''
    Description: Cluster Ecs Name

  PdfRasterECSClusterName:
    Type: String
    Default: ''
    Description: 'Cluster Ecs Name'

  EnvironmentType:
    Type: String
    Default: ''
    Description: Environment type

  LambdasBucketName:
    Type: String
    Description: Bucket for save Json with desire count of Ecs

  LambdasBasePath:
    Type: String
    Description: S3 object key prefix for the lambda artifacts

  PnCoreAwsAccountId:
    Type: String
    Description: Core Account ID (leave blank in Core account)
    Default: ''

  ExternalChannelsMockDesiredCount:
    Type: Number
    Description: Desired count to preserve for the External Channels mock services in confinfo accounts
    Default: 4

Conditions:
  IsNotProdAccount: !Not [ !Equals [!Ref EnvironmentType, prod ] ]
  IsNotUatAccount: !Not [ !Equals [!Ref EnvironmentType, uat ] ]
  IsConfinfoAccount: !Not [ !Equals [!Ref PnCoreAwsAccountId, '' ] ]
  IsStopEcsService: !And [ !Condition IsNotProdAccount, !Condition IsNotUatAccount ]
  IsStopEcsServiceConfinfo: !And [ !Condition IsNotProdAccount, !Condition IsNotUatAccount, !Condition IsConfinfoAccount]
  IsHotfixAccount: !Equals [!Ref EnvironmentType, hotfix ]

#LAMBDA STOP EC2

Resources:
  StopEc2Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.14
      Timeout: 120
      Handler: ec2-stop.lambda_handler
      FunctionName: !Sub 'Lambda-Ec2-stop-${EnvironmentType}'
      Code:
        S3Bucket: !Ref LambdasBucketName
        S3Key: !Sub "${LambdasBasePath}/ec2-stop.zip"
      Environment:
        Variables:
          StopEc2FunctionTagName:
            Ref: StopEc2FunctionTagName
          StopEc2FunctionTagValue:
            Ref: StopEc2FunctionTagValue
          Ec2ReportRequiredTagName:
            Ref: Ec2ReportRequiredTagName
          Ec2ReportRequiredTagValue:
            Ref: Ec2ReportRequiredTagValue
          EnvironmentType:
            Ref: EnvironmentType
          AwsAccountId: !Ref AWS::AccountId
          AccountType: !If [IsConfinfoAccount, confinfo, core]
          WarningSNSTopicArn: !If
            - IsConfinfoAccount
            - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${PnCoreAwsAccountId}:${WarningSNSTopicName}'
            - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}'
      Role:
        Fn::GetAtt:
          - StopEc2FunctionRole
          - Arn

  StopEc2FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StopEc2FunctionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:StopInstances
                Resource: "*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !If
                  - IsConfinfoAccount
                  - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${PnCoreAwsAccountId}:${WarningSNSTopicName}'
                  - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}'
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: arn:aws:logs:*:*:*

  StopEc2FunctionSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'Ec2FunctionStopSchedule-${EnvironmentType}'
      Description: !Sub 'EC2 cost-saving stop schedule for the ${EnvironmentType} environment'
      ScheduleExpression: !Ref StopEc2FunctionTagNameCronExpression
      ScheduleExpressionTimezone: Europe/Rome
      State: !Ref StopEc2FunctionScheduleState
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt StopEc2Function.Arn
        RoleArn: !GetAtt Ec2FunctionScheduleRole.Arn
        Input: '{"action":"stop"}'

  StopEc2FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy : Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StopEc2Function}"
      RetentionInDays: 3

  Ec2FunctionScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Ec2SchedulerInvokePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt StopEc2Function.Arn

  Ec2MonthlyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'Ec2MonthlyReportSchedule-${EnvironmentType}'
      Description: !Sub 'Monthly EC2 inventory for the ${EnvironmentType} environment'
      ScheduleExpression: !Ref Ec2MonthlyReportCronExpression
      ScheduleExpressionTimezone: Europe/Rome
      State: !Ref Ec2MonthlyReportScheduleState
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt StopEc2Function.Arn
        RoleArn: !GetAtt Ec2FunctionScheduleRole.Arn
        Input: '{"action":"report"}'

#LAMBDA ECS COST SAVING

  EcsCostSavingFunction:
    Condition: IsStopEcsService
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.14
      Timeout: 120
      Handler: ecs-cost-saving.lambda_handler
      FunctionName: !Sub 'Lambda-Ecs-Cost-Saving-${EnvironmentType}'
      Code:
        S3Bucket: !Ref LambdasBucketName
        S3Key: !Sub "${LambdasBasePath}/ecs-cost-saving.zip"
      Environment:
        Variables:
          EcsDesireCountBucket:
            Ref: LambdasBucketName
          EnvironmentType:
            Ref: EnvironmentType
          AwsAccountId: 
            Fn::Sub: "${AWS::AccountId}"
          ExternalChannelsMockDesiredCount:
            Fn::If:
              - IsConfinfoAccount
              - Ref: ExternalChannelsMockDesiredCount
              - ''
          ECSClusterName: 
            Fn::If:
              - IsStopEcsServiceConfinfo
              - !Join 
                  - ","
                  - 
                    - Ref: ECSClusterName
                    - Ref: PdfRasterECSClusterName
              - Ref: ECSClusterName
      Role:
        Fn::GetAtt:
          - EcsOptimizedCostFunctionRole
          - Arn

  EcsOptimizedCostFunctionRole:
    Condition: IsStopEcsService
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcsOptimizedCostFunctionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${LambdasBucketName}"
                  - !Sub "arn:aws:s3:::${LambdasBucketName}/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:github-token-*"
              - Effect: Allow
                Action:
                  - ecs:*
                Resource:
                  Fn::If:
                    - IsStopEcsServiceConfinfo
                    - 
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*/${ECSClusterName}"
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*/${ECSClusterName}/*"
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*/${PdfRasterECSClusterName}"
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*/${PdfRasterECSClusterName}/*"
                    - 
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*/${ECSClusterName}"
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*/${ECSClusterName}/*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: arn:aws:logs:*:*:*

  EcsFunctionScheduleRole:
    Condition: IsStopEcsService
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcsSchedulerInvokePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt EcsCostSavingFunction.Arn

  EcsFunctionStopSchedule:
    Condition: IsStopEcsService
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'EcsFunctionStopSchedule-${EnvironmentType}'
      ScheduleExpression:
        Fn::If:
        - IsHotfixAccount
        - cron(0 20 ? * * *)
        - !Ref StopEcsCostSavingFunctionCronExpression
      ScheduleExpressionTimezone: Europe/Rome
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt EcsCostSavingFunction.Arn
        RoleArn: !GetAtt EcsFunctionScheduleRole.Arn
        Input: '{"action": "stop"}'

  StopEcsFunctionLogGroup:
    Condition: IsStopEcsService
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy : Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EcsCostSavingFunction}"
      RetentionInDays: 3

  EcsFunctionStartSchedule:
    Condition: IsStopEcsService
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'EcsFunctionStartSchedule-${EnvironmentType}'
      ScheduleExpression: !Ref StartEcsCostSavingFunctionCronExpression
      ScheduleExpressionTimezone: Europe/Rome
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt EcsCostSavingFunction.Arn
        RoleArn: !GetAtt EcsFunctionScheduleRole.Arn
        Input: '{"action": "start"}'

  StartEcsFunctionLogGroup:
    Condition: IsStopEcsService
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy : Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EcsCostSavingFunction}-Start"
      RetentionInDays: 3
