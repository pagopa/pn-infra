AWSTemplateFormatVersion: 2010-09-09
Description: IAM Access Analyzer - Detects unused access using a local ACCOUNT_UNUSED_ACCESS analyzer. The Lambda exports CSV and HTML reports to S3, including microservice evidence from IAM tags (when available).

Parameters:

  ProjectName:
    Type: String
    Description: Project prefix
    Default: pn

  EnvironmentType:
    Type: String
    Description: Environment name (dev|test|uat|hotfix|prod).
    AllowedValues: [dev, test, uat, hotfix, prod]

  PnCoreAwsAccountId:
    Type: String
    Default: ''
    Description: Core account ID

  PnConfigurationCommitId:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{40}$'
    Description: Git commit containing the IAM Access Analyzer mutelist in pn-configuration.

  GithubTokenName:
    Type: String
    Default: github-token
    Description: Secrets Manager secret containing a read-only GitHub token.

  AnalyzerName:
    Type: String
    Default: unused-access-analyzer
    Description: Name for the Access Analyzer resource

  TrackingPeriodDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 365
    Description: Threshold (in days) to consider a permission as unused. Valid range is 1..365 per AWS limits.

  ScheduleExpression:
    Type: String
    Default: cron(0 2 ? * MON *)
    Description: EventBridge schedule expression for the exporter Lambda.

  EnableExporterSchedule:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: EventBridge exporter rule state.

  ResolveRoleTagsInExporter:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: If true, the exporter Lambda enriches the CSV with the IAM Microservice tag (microservice_tag column). If false, it sets microservice_tag=no-tag.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention for the exporter Lambda.

  S3lifecyclepolicyReportInDays:
    Type: Number
    Default: 180
    Description: Retention period (in days) for exported reports in S3. Older reports will be automatically deleted by the S3 lifecycle configuration.

  LambdasBucketName:
    Type: String
    Description: S3 bucket name containing Lambda deployment packages

  LambdasBasePath:
    Type: String
    Description: S3 key prefix for Lambda deployment packages
    Default: ''

  WarningSNSTopicName:
    Type: String
    Default: pn-WarningSnsTopic
    Description: 'SNS topic name for routed warning and report events'

  ReportNotificationsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: If true, publish the unused access report event to the warning topic.

  HtmlReportEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: If true, generate an HTML report alongside the CSV report in S3.

  LambdaRuntime:
    Type: String
    Default: python3.14
    Description: Python runtime version for Lambda functions

  ExcludeTagKey:
    Type: String
    Default: ''
    Description: Tag key to check on IAM roles. If a role has this tag, its findings are programmatically archived.

Conditions:
  IsConfinfoAccount: !Not [ !Equals [ !Ref PnCoreAwsAccountId, '' ] ]

Resources:
  UnusedAccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Properties:
      AnalyzerName: !Sub '${ProjectName}-${AnalyzerName}-${EnvironmentType}'
      Type: ACCOUNT_UNUSED_ACCESS
      AnalyzerConfiguration:
        UnusedAccessConfiguration:
          UnusedAccessAge: !Ref TrackingPeriodDays

  LocalReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-iam-unused-access-reports-${EnvironmentType}-${AWS::AccountId}'
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref S3lifecyclepolicyReportInDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-old-reports
            Status: Enabled
            ExpirationInDays: !Ref S3lifecyclepolicyReportInDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref S3lifecyclepolicyReportInDays

  LocalReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LocalReportsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LocalReportsBucket.Arn
              - !Sub '${LocalReportsBucket.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  ExporterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-iam-unused-access-exporter-${EnvironmentType}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-iam-unused-access-exporter-${EnvironmentType}:*'
        - PolicyName: access-analyzer-readonly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:GetAnalyzer
                  - access-analyzer:ListFindings*
                  - access-analyzer:GetFinding*
                  - access-analyzer:ListArchiveRules
                  - access-analyzer:ApplyArchiveRule
                  - access-analyzer:CreateArchiveRule
                  - access-analyzer:DeleteArchiveRule
                Resource: '*'
        - PolicyName: s3-read-write-reports
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:AbortMultipartUpload
                Resource: !Sub
                  - '${BucketArn}/${Env}/${Role}/*'
                  - BucketArn: !GetAtt LocalReportsBucket.Arn
                    Env: !Ref EnvironmentType
                    Role: !If [IsConfinfoAccount, confinfo, core]
        - PolicyName: iam-role-metadata-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRoleTags
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*'
        - PolicyName: github-mutelist-token-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GithubTokenName}-*'
        - PolicyName: sns-publish-iam-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !If
                  - IsConfinfoAccount
                  - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${PnCoreAwsAccountId}:${WarningSNSTopicName}'
                  - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}'

  ExporterLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-iam-unused-access-exporter-${EnvironmentType}'
      RetentionInDays: !Ref LogRetentionDays

  ExporterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-iam-unused-access-exporter-${EnvironmentType}'
      Runtime: !Ref LambdaRuntime
      Handler: index.lambda_handler
      Role: !GetAtt ExporterLambdaRole.Arn
      Timeout: 900
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          ANALYZER_ARN: !GetAtt UnusedAccessAnalyzer.Arn
          REPORTS_BUCKET: !Ref LocalReportsBucket
          ENV_NAME: !Ref EnvironmentType
          ACCOUNT_ROLE: !If [IsConfinfoAccount, 'confinfo', 'core']
          RESOLVE_ROLE_TAGS: !Ref ResolveRoleTagsInExporter
          REPORT_NOTIFICATIONS_ENABLED: !Ref ReportNotificationsEnabled
          HTML_REPORT_ENABLED: !Ref HtmlReportEnabled
          SNS_TOPIC_ARN: !If
            - IsConfinfoAccount
            - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${PnCoreAwsAccountId}:${WarningSNSTopicName}'
            - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}'
          EXCLUDE_TAG_KEY: !Ref ExcludeTagKey
          PN_CONFIGURATION_REPOSITORY: pagopa/pn-configuration
          PN_CONFIGURATION_COMMIT_ID: !Ref PnConfigurationCommitId
          GITHUB_TOKEN_NAME: !Ref GithubTokenName
          MUTELIST_PATH: !If
            - IsConfinfoAccount
            - !Sub '${EnvironmentType}/_conf/confinfo/tools/iam-access-analyzer-mutelist.json'
            - !Sub '${EnvironmentType}/_conf/core/tools/iam-access-analyzer-mutelist.json'
      Code:
        S3Bucket: !Ref LambdasBucketName
        S3Key: !Sub ${LambdasBasePath}/iam-unused-access-exporter.zip

  ExporterScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-iam-unused-access-scheduler-${EnvironmentType}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-exporter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ExporterLambda.Arn

  ExporterScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-iam-unused-access-exporter-${EnvironmentType}'
      Description: Periodic execution rule for the IAM Access Analyzer exporter Lambda
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref EnableExporterSchedule
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt ExporterLambda.Arn
        RoleArn: !GetAtt ExporterScheduleRole.Arn

Outputs:

  AnalyzerArn:
    Description: ARN of the local IAM Access Analyzer
    Value: !GetAtt UnusedAccessAnalyzer.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AnalyzerArn'

  ExporterLambdaArn:
    Description: ARN of the exporter Lambda
    Value: !GetAtt ExporterLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ExporterLambdaArn'

  ExporterLambdaRoleArn:
    Description: ARN of the exporter Lambda role
    Value: !GetAtt ExporterLambdaRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ExporterLambdaRoleArn'

  LocalReportsBucketName:
    Description: Name of the local reports bucket for the current account
    Value: !Ref LocalReportsBucket
    Export:
      Name: !Sub '${AWS::StackName}-LocalReportsBucketName'
