AWSTemplateFormatVersion: '2010-09-09'
Description: Scheduled Prowler scans for the core and confinfo accounts, with HTML and CSV reports stored in S3.

Parameters:
  EnvironmentType:
    Type: String
    AllowedValues: [dev, hotfix]

  AccountType:
    Type: String
    AllowedValues: [core, confinfo]

  PnCoreAwsAccountId:
    Type: String
    Default: ''

  ConfidentialInfoAccountId:
    Type: String
    Default: ''

  ProwlerImageUri:
    Type: String
    Description: Official Prowler image from AWS Public ECR pinned by immutable digest.

  ProwlerRegions:
    Type: String
    Default: eu-south-1 eu-central-1
    Description: Space-separated AWS regions scanned by Prowler.

  PnConfigurationCommitId:
    Type: String
    Description: Git commit containing the Prowler mutelist in the private pn-configuration repository.

  GithubTokenName:
    Type: String
    Description: Secrets Manager secret containing a read-only GitHub token.

  TemplateBucketBaseUrl:
    Type: String
    Description: Base URL of the S3 location containing nested runtime infrastructure templates.

  ScheduleExpression:
    Type: String
    Default: cron(0 5 1 1,7 ? *)
    Description: EventBridge expression; defaults to 05:00 UTC on January 1 and July 1.

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]

  ReportsRetentionDays:
    Type: Number
    Default: 548
    MinValue: 365

  CodeBuildLogsRetentionDays:
    Type: Number
    Default: 14
    Description: Retention in days for Prowler CodeBuild CloudWatch logs.

  WarningSNSTopicName:
    Type: String
    Default: pn-WarningSnsTopic
    Description: SNS topic name for routed warning and report events.

Rules:
  RequirePeerAccountId:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref AccountType, core]
            - !Not [!Equals [!Ref ConfidentialInfoAccountId, '']]
          - !And
            - !Equals [!Ref AccountType, confinfo]
            - !Not [!Equals [!Ref PnCoreAwsAccountId, '']]
        AssertDescription: Core requires ConfidentialInfoAccountId; confinfo requires PnCoreAwsAccountId.

Conditions:
  IsCoreAccount: !Equals [!Ref AccountType, core]

Resources:
  ProwlerScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pn-prowler-scan-${EnvironmentType}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - IsCoreAccount
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
                - !Sub arn:${AWS::Partition}:iam::${PnCoreAwsAccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !If
                  - IsCoreAccount
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/pn-prowler-codebuild-${EnvironmentType}
                  - !Sub arn:${AWS::Partition}:iam::${PnCoreAwsAccountId}:role/pn-prowler-codebuild-${EnvironmentType}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess

  ReportsBucket:
    Type: AWS::S3::Bucket
    Condition: IsCoreAccount
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub pn-prowler-reports-${AWS::Region}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: RetainAuditHistory
            Status: Enabled
            ExpirationInDays: !Ref ReportsRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsCoreAccount
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ReportsBucket.Arn
              - !Sub ${ReportsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ProwlerCodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsCoreAccount
    Properties:
      LogGroupName: /aws/codebuild/pn-prowler
      RetentionInDays: !Ref CodeBuildLogsRetentionDays

  ProwlerCodeBuildRole:
    Type: AWS::IAM::Role
    Condition: IsCoreAccount
    Properties:
      RoleName: !Sub pn-prowler-codebuild-${EnvironmentType}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunProwler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/pn-prowler-scan-${EnvironmentType}
                  - !Sub arn:${AWS::Partition}:iam::${ConfidentialInfoAccountId}:role/pn-prowler-scan-${EnvironmentType}
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ReportsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${ReportsBucket.Arn}/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GithubTokenName}-*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/pn-prowler:*

  ProwlerCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: IsCoreAccount
    Properties:
      Name: !Sub pn-prowler-${EnvironmentType}
      Description: !Sub Prowler scan of the ${EnvironmentType} core and confinfo accounts
      ServiceRole: !GetAtt ProwlerCodeBuildRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 120
      Artifacts:
        Type: NO_ARTIFACTS
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ProwlerCodeBuildLogGroup
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - docker pull "$PROWLER_IMAGE_URI"
                - docker image inspect "$PROWLER_IMAGE_URI" --format '{{json .RepoDigests}}'
            build:
              commands:
                - RUN_DATE=$(date -u +%Y/%m/%d/%H%M%S)
                - |
                  set -eu
                  GITHUB_TOKEN=$(aws secretsmanager get-secret-value \
                    --secret-id "$GITHUB_TOKEN_SECRET_NAME" \
                    --query SecretString \
                    --output text)
                  MUTELIST_PATH="${ENVIRONMENT_TYPE}/_conf/core/prowler-mutelist.yaml"
                  curl --fail-with-body --silent --show-error \
                    -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github.raw+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/pagopa/pn-configuration/contents/${MUTELIST_PATH}?ref=${PN_CONFIGURATION_COMMIT_ID}" \
                    --output /tmp/prowler-mutelist.yaml
                  unset GITHUB_TOKEN
                  test -s /tmp/prowler-mutelist.yaml
                  MUTELIST_SHA256=$(sha256sum /tmp/prowler-mutelist.yaml | cut -d ' ' -f 1)
                - |
                  cleanup_credentials() {
                    rm -f /tmp/prowler-*.env /tmp/prowler-*-credentials.json
                  }
                  trap cleanup_credentials EXIT
                  for TARGET in core confinfo; do
                    if [ "$TARGET" = "core" ]; then
                      ACCOUNT_ID="$CORE_ACCOUNT_ID"
                    else
                      ACCOUNT_ID="$CONFINFO_ACCOUNT_ID"
                    fi
                    CREDENTIALS_FILE="/tmp/prowler-${TARGET}.env"
                    umask 077
                    aws sts assume-role \
                      --role-arn "arn:${AWS_PARTITION}:iam::${ACCOUNT_ID}:role/pn-prowler-scan-${ENVIRONMENT_TYPE}" \
                      --role-session-name "pn-prowler-${ENVIRONMENT_TYPE}-${TARGET}" \
                      --duration-seconds 3600 \
                      --output json > "/tmp/prowler-${TARGET}-credentials.json"
                    jq -r \
                      --arg region "$AWS_REGION" \
                      '"AWS_ACCESS_KEY_ID=" + .Credentials.AccessKeyId,
                       "AWS_SECRET_ACCESS_KEY=" + .Credentials.SecretAccessKey,
                       "AWS_SESSION_TOKEN=" + .Credentials.SessionToken,
                       "AWS_DEFAULT_REGION=" + $region' \
                      "/tmp/prowler-${TARGET}-credentials.json" > "$CREDENTIALS_FILE"
                    rm -f "/tmp/prowler-${TARGET}-credentials.json"
                    mkdir -p "output/${TARGET}"
                    chmod 0777 "output/${TARGET}"
                    docker run --rm \
                      --env-file "$CREDENTIALS_FILE" \
                      --volume "$CODEBUILD_SRC_DIR/output/${TARGET}:/home/prowler/output" \
                      --volume "/tmp/prowler-mutelist.yaml:/home/prowler/prowler-mutelist.yaml:ro" \
                      "$PROWLER_IMAGE_URI" aws \
                      --region $PROWLER_REGIONS \
                      --output-formats csv json-ocsf html \
                      --output-directory /home/prowler/output \
                      --output-filename "prowler-${TARGET}" \
                      --mutelist-file /home/prowler/prowler-mutelist.yaml \
                      --ignore-exit-code-3 \
                      --no-color
                    rm -f "$CREDENTIALS_FILE"
                  done
                  trap - EXIT
                - |
                  CORE_CSV="output/core/prowler-core.csv"
                  CONFINFO_CSV="output/confinfo/prowler-confinfo.csv"
                  CORE_HTML="output/core/prowler-core.html"
                  CONFINFO_HTML="output/confinfo/prowler-confinfo.html"
                  for ARTIFACT in "$CORE_CSV" "$CONFINFO_CSV" "$CORE_HTML" "$CONFINFO_HTML"; do
                    test -s "$ARTIFACT"
                  done
                  test "$(head -n 1 "$CORE_CSV")" = "$(head -n 1 "$CONFINFO_CSV")"
                  mkdir -p output/combined
                  {
                    head -n 1 "$CORE_CSV"
                    tail -n +2 "$CORE_CSV"
                    tail -n +2 "$CONFINFO_CSV"
                  } > output/combined/prowler.csv
                - |
                  for TARGET in core confinfo; do
                    aws s3 cp "output/${TARGET}" \
                      "s3://${REPORTS_BUCKET}/reports/${ENVIRONMENT_TYPE}/${RUN_DATE}/${TARGET}/" \
                      --recursive \
                      --exclude '*.html'
                    HTML_KEY="reports/${ENVIRONMENT_TYPE}/${RUN_DATE}/${TARGET}/prowler-${TARGET}.html"
                    aws s3 cp "output/${TARGET}/prowler-${TARGET}.html" \
                      "s3://${REPORTS_BUCKET}/${HTML_KEY}" \
                      --content-type text/html \
                      --content-disposition "attachment; filename=\"prowler-${TARGET}.html\""
                  done
                  FINDINGS_KEY="findings/${ENVIRONMENT_TYPE}/${RUN_DATE}/prowler.csv"
                  aws s3 cp output/combined/prowler.csv \
                    "s3://${REPORTS_BUCKET}/${FINDINGS_KEY}"
                  MANIFEST=$(jq -n -c \
                    --arg run_date "$RUN_DATE" \
                    --arg prowler_image_uri "$PROWLER_IMAGE_URI" \
                    --arg pn_configuration_commit_id "$PN_CONFIGURATION_COMMIT_ID" \
                    --arg mutelist_path "$MUTELIST_PATH" \
                    --arg mutelist_sha256 "$MUTELIST_SHA256" \
                    --arg findings_key "$FINDINGS_KEY" \
                    '{
                      status: "COMPLETED",
                      runDate: $run_date,
                      prowlerImageUri: $prowler_image_uri,
                      pnConfigurationCommitId: $pn_configuration_commit_id,
                      mutelistPath: $mutelist_path,
                      mutelistSha256: $mutelist_sha256,
                      accounts: ["core", "confinfo"],
                      findingsKey: $findings_key
                    }')
                  printf '%s\n' "$MANIFEST" | aws s3 cp - \
                    "s3://${REPORTS_BUCKET}/reports/${ENVIRONMENT_TYPE}/${RUN_DATE}/manifest.json" \
                    --content-type application/json
                - |
                  REPORT_EVENT_ID="${CODEBUILD_BUILD_ID:-pn-prowler-${RUN_DATE}}"
                  REPORT_OCCURRED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  REPORT_MESSAGE=$(jq -n -c \
                    --arg event_id "$REPORT_EVENT_ID" \
                    --arg occurred_at "$REPORT_OCCURRED_AT" \
                    --arg environment "$ENVIRONMENT_TYPE" \
                    '{
                      schemaVersion: "1.0",
                      eventId: $event_id,
                      eventType: "report",
                      producer: "pn-prowler",
                      eventName: "prowler-scan-completed",
                      occurredAt: $occurred_at,
                      severity: "info",
                      environment: $environment,
                      title: "Prowler scan completed",
                      data: {
                        metrics: {"Account analizzati": 2}
                      }
                    }')
                  aws sns publish \
                    --topic-arn "$WARNING_SNS_TOPIC_ARN" \
                    --subject "Prowler scan completed - ${ENVIRONMENT_TYPE}" \
                    --message "$REPORT_MESSAGE"
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: PROWLER_IMAGE_URI
            Type: PLAINTEXT
            Value: !Ref ProwlerImageUri
          - Name: PROWLER_REGIONS
            Type: PLAINTEXT
            Value: !Ref ProwlerRegions
          - Name: PN_CONFIGURATION_COMMIT_ID
            Type: PLAINTEXT
            Value: !Ref PnConfigurationCommitId
          - Name: GITHUB_TOKEN_SECRET_NAME
            Type: PLAINTEXT
            Value: !Ref GithubTokenName
          - Name: ENVIRONMENT_TYPE
            Type: PLAINTEXT
            Value: !Ref EnvironmentType
          - Name: CORE_ACCOUNT_ID
            Type: PLAINTEXT
            Value: !Ref AWS::AccountId
          - Name: CONFINFO_ACCOUNT_ID
            Type: PLAINTEXT
            Value: !Ref ConfidentialInfoAccountId
          - Name: REPORTS_BUCKET
            Type: PLAINTEXT
            Value: !Ref ReportsBucket
          - Name: AWS_PARTITION
            Type: PLAINTEXT
            Value: !Ref AWS::Partition
          - Name: WARNING_SNS_TOPIC_ARN
            Type: PLAINTEXT
            Value: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}

  ProwlerCodeBuildAlarms:
    Type: AWS::CloudFormation::Stack
    Condition: IsCoreAccount
    Properties:
      TemplateURL: !Sub ${TemplateBucketBaseUrl}/fragments/codebuild-alarms.yaml
      Parameters:
        CodeBuildProjectName: !Ref ProwlerCodeBuildProject
        AlarmSNSTopicArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}

  ProwlerScheduleRole:
    Type: AWS::IAM::Role
    Condition: IsCoreAccount
    Properties:
      RoleName: !Sub pn-prowler-scheduler-${EnvironmentType}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: StartProwlerBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt ProwlerCodeBuildProject.Arn

  ProwlerSchedule:
    Type: AWS::Events::Rule
    Condition: IsCoreAccount
    Properties:
      Name: !Sub pn-prowler-${EnvironmentType}
      Description: Starts the scheduled core and confinfo Prowler scan
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref ScheduleState
      Targets:
        - Arn: !GetAtt ProwlerCodeBuildProject.Arn
          Id: ProwlerCodeBuild
          RoleArn: !GetAtt ProwlerScheduleRole.Arn

