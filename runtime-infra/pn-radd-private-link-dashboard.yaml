AWSTemplateFormatVersion: 2010-09-09
Description: 'CloudWatch dashboard for the RADD PrivateLink channel'

Parameters:
  ProjectName:
    Type: String
    Description: 'Project name'

  ApplicationLoadBalancerArn:
    Type: String
    Description: 'Application Load Balancer ARN'

  RaddNetworkLoadBalancerArn:
    Type: String
    Description: 'RADD Network Load Balancer ARN'

  RaddVpcEndpointServiceId:
    Type: String
    Description: 'RADD VPC endpoint service ID'

  MetricNamespace:
    Type: String
    Default: Advanced
    Description: 'CloudWatch custom metric namespace used by RADD'

Resources:
  RaddPrivateLinkDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-Radd-PrivateLink'
      DashboardBody:
        Fn::Sub:
          - |
            {
              "start": "-PT6H",
              "periodOverride": "inherit",
              "widgets": [
                {
                  "type": "metric",
                  "x": 0,
                  "y": 0,
                  "width": 6,
                  "height": 6,
                  "properties": {
                    "title": "Requests Count",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "yAxis": {
                      "left": {
                        "min": 0
                      }
                    },
                    "metrics": [
                      [
                        {
                          "expression": "SUM([TIME_SERIES(0),SEARCH('{AWS/ApplicationELB,LoadBalancer,TargetGroup} MetricName=\"RequestCount\" LoadBalancer=\"${AlbDimension}\" TargetGroup=targetgroup/${ProjectName}-rpp-lambda-tg', 'Sum', 300)])",
                          "id": "requests",
                          "label": "Requests",
                          "color": "#1f77b4"
                        }
                      ]
                    ]
                  }
                },
                {
                  "type": "log",
                  "x": 6,
                  "y": 0,
                  "width": 6,
                  "height": 6,
                  "properties": {
                    "title": "Latency p99",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | filter @message like /RADD private proxy forwarded request/ | parse @message /durationMs[^0-9]+(?<durationMs>[0-9]+)/ | stats pct(durationMs, 99) as P99 by bin(5m)"
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 0,
                  "width": 6,
                  "height": 6,
                  "properties": {
                    "title": "5XXError",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "yAxis": {
                      "left": {
                        "min": 0
                      }
                    },
                    "metrics": [
                      [
                        {
                          "expression": "SUM([TIME_SERIES(0),SEARCH('{${MetricNamespace}} MetricName=\"${ProjectName}-radd-alt-private-proxy-backend-5xx\"', 'Sum', 300)])",
                          "id": "backend5xx",
                          "label": "5XXError",
                          "color": "#d62728"
                        }
                      ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 18,
                  "y": 0,
                  "width": 6,
                  "height": 6,
                  "properties": {
                    "title": "4XXError",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "yAxis": {
                      "left": {
                        "min": 0
                      }
                    },
                    "metrics": [
                      [
                        {
                          "expression": "SUM([TIME_SERIES(0),SEARCH('{${MetricNamespace}} MetricName=\"${ProjectName}-radd-alt-private-proxy-backend-4xx\"', 'Sum', 300)])",
                          "id": "backend4xx",
                          "label": "4XXError",
                          "color": "#ff7f0e"
                        }
                      ]
                    ]
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 29,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Proxy Errors",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | filter @message like /RADD private proxy backend forward failed|RADD private proxy rejected path|RADD private proxy failed Host validation/ | parse @message /RADD private proxy (?<errorType>backend forward failed|rejected path|failed Host validation)/ | stats count(*) as Errors by bin(5m), errorType"
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 29,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Invocation and Runtime Errors",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "yAxis": {
                      "left": {
                        "min": 0
                      }
                    },
                    "metrics": [
                      [
                        {
                          "expression": "SUM([TIME_SERIES(0),SEARCH('{AWS/ApplicationELB,LoadBalancer,TargetGroup} MetricName=\"LambdaInternalError\" LoadBalancer=\"${AlbDimension}\" TargetGroup=targetgroup/${ProjectName}-rpp-lambda-tg', 'Sum', 300)])",
                          "id": "internal",
                          "label": "LambdaInternalError",
                          "color": "#d62728"
                        }
                      ],
                      [
                        {
                          "expression": "SUM([TIME_SERIES(0),SEARCH('{AWS/ApplicationELB,LoadBalancer,TargetGroup} MetricName=\"LambdaUserError\" LoadBalancer=\"${AlbDimension}\" TargetGroup=targetgroup/${ProjectName}-rpp-lambda-tg', 'Sum', 300)])",
                          "id": "user",
                          "label": "LambdaUserError",
                          "color": "#9467bd"
                        }
                      ],
                      [
                        {
                          "expression": "SUM([TIME_SERIES(0),SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Errors\" FunctionName=\"${ProjectName}-radd-alt-private-proxy\"', 'Sum', 300)])",
                          "id": "lambdaerrors",
                          "label": "Lambda Errors",
                          "color": "#8c564b"
                        }
                      ],
                      [
                        {
                          "expression": "SUM([TIME_SERIES(0),SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Throttles\" FunctionName=\"${ProjectName}-radd-alt-private-proxy\"', 'Sum', 300)])",
                          "id": "throttles",
                          "label": "Lambda Throttles",
                          "color": "#e377c2"
                        }
                      ]
                    ]
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 6,
                  "width": 24,
                  "height": 8,
                  "properties": {
                    "title": "Log 4xx or 5xx",
                    "view": "table",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | fields @timestamp, @message | filter @message like /RADD private proxy backend 4xx response|RADD private proxy backend 5xx response/ | parse @message /RADD private proxy (?<event>backend 4xx response|backend 5xx response)/ | parse @message /method[^A-Z]+(?<method>[A-Z]+)/ | parse @message /path: '(?<path>[^']+)'/ | parse @message /statusCode[^0-9]+(?<statusCode>[0-9]+)/ | parse @message /durationMs[^0-9]+(?<durationMs>[0-9]+)/ | parse @message /attempts[^0-9]+(?<attempts>[0-9]+)/ | display @timestamp, event, method, path, statusCode, durationMs, attempts | sort @timestamp desc | limit 100"
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 36,
                  "width": 24,
                  "height": 7,
                  "properties": {
                    "title": "Proxy Error Log",
                    "view": "table",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | fields @timestamp, @message | filter @message like /RADD private proxy backend forward failed|RADD private proxy rejected path|RADD private proxy failed Host validation/ | parse @message /RADD private proxy (?<event>backend forward failed|rejected path|failed Host validation)/ | parse @message /method[^A-Z]+(?<method>[A-Z]+)/ | parse @message /path: '(?<path>[^']+)'/ | display @timestamp, event, method, path, @message | sort @timestamp desc | limit 100"
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 14,
                  "width": 24,
                  "height": 8,
                  "properties": {
                    "title": "Response latency >= 2s",
                    "view": "table",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | fields @timestamp, @message | filter @message like /RADD private proxy forwarded request/ | parse @message /method[^A-Z]+(?<method>[A-Z]+)/ | parse @message /path: '(?<path>[^']+)'/ | parse @message /statusCode[^0-9]+(?<statusCode>[0-9]+)/ | parse @message /durationMs[^0-9]+(?<durationMs>[0-9]+)/ | parse @message /attempts[^0-9]+(?<attempts>[0-9]+)/ | filter durationMs >= 2000 | display @timestamp, method, path, statusCode, durationMs, attempts | sort durationMs desc | limit 100"
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 22,
                  "width": 24,
                  "height": 7,
                  "properties": {
                    "title": "Request count by operation per hour",
                    "view": "table",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | filter @message like /RADD private proxy forwarded request/ | parse @message /method[^A-Z]+(?<method>[A-Z]+)/ | parse @message /path: '(?<path>[^']+)'/ | stats count(*) as Requests by bin(1h) as Hour, method, path | sort Hour desc, Requests desc | limit 100"
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 43,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Request count by status code",
                    "view": "table",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | filter @message like /RADD private proxy forwarded request/ | parse @message /statusCode[^0-9]+(?<statusCode>[0-9]+)/ | stats count(*) as Requests by statusCode | sort Requests desc"
                  }
                },
                {
                  "type": "log",
                  "x": 12,
                  "y": 43,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Latency by operation",
                    "view": "table",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | filter @message like /RADD private proxy forwarded request/ | parse @message /method[^A-Z]+(?<method>[A-Z]+)/ | parse @message /path: '(?<path>[^']+)'/ | parse @message /durationMs[^0-9]+(?<durationMs>[0-9]+)/ | stats count(*) as Requests, avg(durationMs) as AverageMs, pct(durationMs, 95) as P95Ms, pct(durationMs, 99) as P99Ms by method, path | sort Requests desc | limit 100"
                  }
                }
              ]
            }
          - AlbDimension: !Select [1, !Split ['loadbalancer/', !Ref ApplicationLoadBalancerArn]]
            ProxyLogGroupName: !Sub '/aws/lambda/${ProjectName}-radd-alt-private-proxy'

Outputs:
  DashboardName:
    Value: !Ref RaddPrivateLinkDashboard
