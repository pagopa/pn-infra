AWSTemplateFormatVersion: 2010-09-09
Description: 'CloudWatch dashboard for the RADD PrivateLink channel'

Parameters:
  ProjectName:
    Type: String
    Description: 'Project name'

  ApplicationLoadBalancerArn:
    Type: String
    Description: 'Application Load Balancer ARN'

  RaddNetworkLoadBalancerArn:
    Type: String
    Description: 'RADD Network Load Balancer ARN'

  RaddVpcEndpointServiceId:
    Type: String
    Description: 'RADD VPC endpoint service ID'

  MetricNamespace:
    Type: String
    Default: Advanced
    Description: 'CloudWatch custom metric namespace used by RADD'

Resources:
  RaddPrivateLinkDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-Radd-PrivateLink'
      DashboardBody:
        Fn::Sub:
          - |
            {
              "start": "-PT6H",
              "periodOverride": "inherit",
              "widgets": [
                {
                  "type": "text",
                  "x": 0,
                  "y": 0,
                  "width": 24,
                  "height": 2,
                  "properties": {
                    "markdown": "# RADD PrivateLink\nPrivateLink -> NLB/TLS -> ALB/Lambda -> RADD backend. Logged duration is backend latency, not end-to-end latency."
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 2,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "PrivateLink connections and traffic",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      [ "AWS/PrivateLinkServices", "ActiveConnections", "Service Id", "${RaddVpcEndpointServiceId}", { "stat": "Maximum" } ],
                      [ ".", "NewConnections", ".", "." ],
                      [ ".", "EndpointsCount", ".", ".", { "stat": "Maximum" } ],
                      [ ".", "BytesProcessed", ".", "." ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 2,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "NLB TLS flows and traffic",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      [ "AWS/NetworkELB", "ActiveFlowCount_TLS", "LoadBalancer", "${NlbDimension}", { "stat": "Maximum" } ],
                      [ ".", "NewFlowCount_TLS", ".", "." ],
                      [ ".", "ProcessedBytes_TLS", ".", "." ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 8,
                  "width": 24,
                  "height": 6,
                  "properties": {
                    "title": "PrivateLink and NLB errors",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      [ "AWS/PrivateLinkServices", "RstPacketsSent", "Service Id", "${RaddVpcEndpointServiceId}" ],
                      [ "AWS/NetworkELB", "ClientTLSNegotiationErrorCount", "LoadBalancer", "${NlbDimension}" ],
                      [ ".", "TargetTLSNegotiationErrorCount", ".", "." ],
                      [ ".", "TCP_Client_Reset_Count", ".", "." ],
                      [ ".", "TCP_ELB_Reset_Count", ".", "." ],
                      [ ".", "TCP_Target_Reset_Count", ".", "." ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 14,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "Proxy invocations and errors",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      [ "AWS/Lambda", "Invocations", "FunctionName", "${ProjectName}-radd-alt-private-proxy" ],
                      [ ".", "Errors", ".", "." ],
                      [ ".", "Throttles", ".", "." ],
                      [ { "expression": "SEARCH('{AWS/ApplicationELB,LoadBalancer,TargetGroup} MetricName=\"LambdaInternalError\" LoadBalancer=\"${AlbDimension}\" \"${ProjectName}-rpp-lambda-tg\"', 'Sum', 300)", "id": "internal", "label": "ALB LambdaInternalError" } ],
                      [ { "expression": "SEARCH('{AWS/ApplicationELB,LoadBalancer,TargetGroup} MetricName=\"LambdaUserError\" LoadBalancer=\"${AlbDimension}\" \"${ProjectName}-rpp-lambda-tg\"', 'Sum', 300)", "id": "user", "label": "ALB LambdaUserError" } ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 14,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "Lambda duration",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      [ "AWS/Lambda", "Duration", "FunctionName", "${ProjectName}-radd-alt-private-proxy", { "stat": "Average" } ],
                      [ "...", { "stat": "p95" } ],
                      [ "...", { "stat": "p99" } ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 20,
                  "width": 24,
                  "height": 6,
                  "properties": {
                    "title": "RADD backend outcomes",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      [ "${MetricNamespace}", "${ProjectName}-radd-alt-private-proxy-backend-4xx" ],
                      [ ".", "${ProjectName}-radd-alt-private-proxy-backend-5xx" ],
                      [ ".", "${ProjectName}-radd-alt-private-proxy-rejected-path" ]
                    ]
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 26,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Backend latency",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | filter @message like /RADD private proxy forwarded request/ | parse @message /durationMs[^0-9]+(?<durationMs>[0-9]+)/ | stats avg(durationMs) as Average, pct(durationMs, 95) as P95, pct(durationMs, 99) as P99 by bin(5m)"
                  }
                },
                {
                  "type": "log",
                  "x": 12,
                  "y": 26,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Recent proxy errors",
                    "view": "table",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '${ProxyLogGroupName}' | fields @timestamp, @message | filter @message like /RADD private proxy backend 4xx response|RADD private proxy backend 5xx response|RADD private proxy backend forward failed|RADD private proxy rejected path/ | sort @timestamp desc | limit 100"
                  }
                }
              ]
            }
          - AlbDimension: !Select [1, !Split ['loadbalancer/', !Ref ApplicationLoadBalancerArn]]
            NlbDimension: !Select [1, !Split ['loadbalancer/', !Ref RaddNetworkLoadBalancerArn]]
            ProxyLogGroupName: !Sub '/aws/lambda/${ProjectName}-radd-alt-private-proxy'

Outputs:
  DashboardName:
    Value: !Ref RaddPrivateLinkDashboard