AWSTemplateFormatVersion: 2010-09-09

Description: >
  CDC Preproc Quarantine Daily Report.
  Generates a daily report of tables with quarantined files,
  stores the JSON report on S3 and optionally publishes
  a summary to the Warning SNS topic.

Parameters:

  ProjectName:
    Type: String
    Description: Project prefix
    Default: pn

  EnvironmentType:
    Type: String
    Description: Environment name (dev|test|uat|hotfix|prod)
    AllowedValues: [dev, test, uat, hotfix, prod]

  LogsBucketName:
    Type: String
    Description: Bucket name containing CDC Preproc quarantine data

  LambdasBucketName:
    Type: String
    Description: S3 bucket name containing Lambda deployment packages

  LambdasBasePath:
    Type: String
    Description: S3 key prefix for Lambda deployment packages
    Default: ''

  WarningSNSTopicName:
    Type: String
    Default: pn-WarningSnsTopic
    Description: SNS topic name for routed warning and report events

  ReportNotificationsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      If true, publish the quarantine report event
      to the Warning SNS topic.

  ScheduleExpression:
    Type: String
    Default: cron(0 6 * * ? *)
    Description: EventBridge schedule expression for the report Lambda

  EnableSchedule:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: EventBridge Scheduler state

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention for the Lambda

  LambdaRuntime:
    Type: String
    Default: python3.14
    Description: Python runtime version for the Lambda


Resources:

  QuarantineDailyReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cdc-preproc-quarantine-daily-report-${EnvironmentType}'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-cdc-preproc-quarantine-daily-report-${EnvironmentType}:*'

        - PolicyName: s3-list-quarantine
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${LogsBucketName}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'cdcTos3/cdc-preproc/quarantine/*'

        - PolicyName: s3-write-report
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${LogsBucketName}/cdcTos3/cdc-preproc/quarantine/report/*'

        - PolicyName: sns-publish-report
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}'


  QuarantineDailyReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-cdc-preproc-quarantine-daily-report-${EnvironmentType}'
      RetentionInDays: !Ref LogRetentionDays


  QuarantineDailyReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-cdc-preproc-quarantine-daily-report-${EnvironmentType}'

      Runtime: !Ref LambdaRuntime

      Handler: index.lambda_handler

      Role: !GetAtt QuarantineDailyReportLambdaRole.Arn

      Timeout: 300

      MemorySize: 256

      ReservedConcurrentExecutions: 1

      Environment:
        Variables:
          S3_BUCKET: !Ref LogsBucketName
          ENVIRONMENT: !Ref EnvironmentType
          SNS_TOPIC_ARN: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${WarningSNSTopicName}'
          REPORT_NOTIFICATIONS_ENABLED: !Ref ReportNotificationsEnabled

      Code:
        S3Bucket: !Ref LambdasBucketName
        S3Key: !Sub '${LambdasBasePath}/cdc-preproc-quarantine-daily-report.zip'


  QuarantineDailyReportScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cdc-preproc-quarantine-daily-report-scheduler-${EnvironmentType}'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

      Policies:

        - PolicyName: invoke-quarantine-daily-report
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt QuarantineDailyReportLambda.Arn


  QuarantineDailyReportScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-cdc-preproc-quarantine-daily-report-${EnvironmentType}'

      Description: Daily execution of CDC Preproc quarantine report

      ScheduleExpression: !Ref ScheduleExpression

      State: !Ref EnableSchedule

      FlexibleTimeWindow:
        Mode: 'OFF'

      Target:
        Arn: !GetAtt QuarantineDailyReportLambda.Arn
        RoleArn: !GetAtt QuarantineDailyReportScheduleRole.Arn
        Input: '{}'


Outputs:

  QuarantineDailyReportLambdaArn:
    Description: ARN of the quarantine daily report Lambda
    Value: !GetAtt QuarantineDailyReportLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QuarantineDailyReportLambdaArn'

  QuarantineDailyReportLambdaRoleArn:
    Description: ARN of the quarantine daily report Lambda role
    Value: !GetAtt QuarantineDailyReportLambdaRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QuarantineDailyReportLambdaRoleArn'

  QuarantineDailyReportScheduleName:
    Description: Name of the quarantine daily report schedule
    Value: !Ref QuarantineDailyReportScheduler